# Settings shared by every region. Each region's own details (title, time zone and stations)
# are in config/regions/.

[screening]
# Outlier screening for the monthly averages. A station-month is left out of the averages when
# its mean temperature is max_gap_f degrees F or more away from that station's median for the same
# calendar month. Screening applies only to stations with at least min_years years of data for
# that month.
max_gap_f = 15.0
min_years = 8

[display]
# A station's recent temperature is shown only if its latest reading is newer than this many hours.
# Older readings are shown as blank cells.
recent_window_hours = 48

[history]
# The monthly job needs the latest year for which both NDBC and CO-OPS have data, and the
# averages run through that year. A source has data for a year if at least one of its active
# stations has data for it. A station is active if its latest reading is within this many days.
# Stations that stopped reporting are skipped.
active_window_days = 365

# The search only looks forward. It checks each year after the latest year already stored, up to
# the last completed year, and the new end year is the latest one that both sources have. NDBC
# publishes its yearly files some months after a year ends, while CO-OPS has the data right away,
# so for the first months of a year the averages still end at the previous year. On the first run,
# when nothing is stored, the search starts at first_year below.

# The first year to request for a station that has no stored data yet. It is set earlier than any
# station's first reading, so years before a station began recording return no data.
first_year = { ndbc = 1970, coops = 1990 }

[http]
# Sent with every data request to identify this project, and how long to wait for a response.
user_agent = "coastal-water-temp-rebuild"
timeout_seconds = 60

# One section per data source. The order of the sections sets the order of the stations in each
# table: NDBC buoys first, then CO-OPS stations.
#   base_url              where requests are sent
#   min_interval_seconds  minimum pause between requests to this source (requests run one at a time)
#   station_page_url      the link on a station's recent temperature; {id} is replaced by the station ID
#   no_data_message       text the source returns when it has no data (CO-OPS answers this way)
[sources.ndbc]
base_url = "https://www.ndbc.noaa.gov"
min_interval_seconds = 1.0
station_page_url = "https://www.ndbc.noaa.gov/station_page.php?station={id}"

[sources.coops]
base_url = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter"
min_interval_seconds = 1.0
station_page_url = "https://tidesandcurrents.noaa.gov/physocean.html?id={id}"
no_data_message = "No data was found"
